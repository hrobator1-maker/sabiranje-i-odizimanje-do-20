<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2764d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Matematika 20">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Sabiranje i oduzimanje do 20</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#18324b;background:#f4f8ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4f8ff}
body{-webkit-text-size-adjust:100%;touch-action:manipulation}
button,input{font:inherit}
button{border:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
#app{min-height:100vh;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
header strong{font-size:clamp(18px,5vw,30px)} header span{font-size:13px;font-weight:800}
#nav{display:flex;gap:8px;margin-bottom:12px}
.navbtn{min-height:48px;padding:8px 14px;border-radius:14px;background:#dce9ff;color:#173a68;font-weight:900}
.view{display:none;width:min(900px,100%);margin:auto;text-align:center}
.view.active{display:block}
h1,h2{margin:10px 0 18px}h1{font-size:clamp(32px,9vw,56px)}h2{font-size:clamp(27px,7vw,44px)}
.menu,.options,.levels{display:grid;gap:12px}
.menu{grid-template-columns:repeat(2,minmax(0,1fr))}
.big,.option,.level{min-height:92px;border-radius:20px;padding:14px;background:#2764d8;color:white;font-size:clamp(19px,4.5vw,28px);font-weight:900;box-shadow:0 5px 0 #174aa8}
.big.alt{background:#7653c7;box-shadow:0 5px 0 #50349a}
.options{grid-template-columns:repeat(3,minmax(0,1fr))}
.option,.level{background:white;color:#17324b;border:3px solid #bdd2f3;box-shadow:none}
.levels{grid-template-columns:repeat(2,minmax(0,1fr))}
.problem{font-size:clamp(50px,15vw,96px);font-weight:950;margin:20px 0}
#visual{font-size:clamp(28px,8vw,48px);min-height:60px;overflow-wrap:anywhere}
.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px auto;width:min(650px,100%)}
.answer{display:flex;align-items:center;justify-content:center;min-height:92px;border-radius:18px;border:4px solid #8bb5ed;background:#fff;color:#17324b;font-size:clamp(38px,10vw,64px);font-weight:950}
.answer.correct{background:#d9f8df;border-color:#28a745}.answer.wrong{background:#ffe0e0;border-color:#d62d2d}
#feedback{min-height:45px;font-size:clamp(23px,6vw,34px);font-weight:950;margin:10px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:15px}
.action{min-height:58px;padding:10px 18px;border-radius:16px;background:#2764d8;color:white;font-size:19px;font-weight:900}
.action.secondary{background:#e4ecf8;color:#17324b}
.inputAnswer{display:block;width:min(260px,80%);min-height:78px;margin:10px auto;padding:8px 14px;border:4px solid #8bb5ed;border-radius:18px;background:white;text-align:center;font-size:48px;font-weight:950;color:#17324b;-webkit-user-select:text;user-select:text}
.keypad{display:grid;grid-template-columns:repeat(3,90px);justify-content:center;gap:8px;margin:12px auto}
.key{height:62px;border-radius:15px;background:#fff;border:3px solid #bdd2f3;font-size:30px;font-weight:900;color:#17324b}
.panel{background:white;border:3px solid #d6e3f5;border-radius:20px;padding:16px;margin:12px auto;width:min(720px,100%)}
.row{display:grid;grid-template-columns:1fr 2fr;align-items:center;gap:10px;margin:10px 0;text-align:left}
.name{width:100%;min-height:58px;border:3px solid #9ebce6;border-radius:14px;padding:8px 12px;font-size:20px;-webkit-user-select:text;user-select:text}
.score{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}.chip{padding:8px 12px;border-radius:12px;background:#e6eef9;font-weight:900}.chip.on{background:#ffd96a}
.progress{font-size:18px;font-weight:900;margin:8px}
@media(max-width:650px){.menu,.levels,.options{grid-template-columns:1fr}.big{min-height:76px}.answers{gap:7px}.answer{min-height:76px}.row{grid-template-columns:1fr}.keypad{grid-template-columns:repeat(3,minmax(70px,90px))}}
</style>
</head>
<body>
<div id="app">
<header><strong>SABIRANJE I ODUZIMANJE DO 20</strong><span>dbahrudin</span></header>
<div id="nav"><button id="backBtn" class="navbtn" type="button">← NAZAD</button><button id="homeBtn" class="navbtn" type="button">⌂ POČETNA</button></div>

<section id="home" class="view active">
<h1>UČIMO I VJEŽBAMO</h1>
<div class="menu">
<button class="big" type="button" data-go="learnAdd">UČIMO SABIRANJE</button>
<button class="big" type="button" data-go="learnSub">UČIMO ODUZIMANJE</button>
<button class="big" type="button" data-go="practice">VJEŽBAMO</button>
<button class="big" type="button" data-go="quiz">BRZI KVIZ</button>
<button class="big" type="button" data-go="competitionSetup">TAKMIČENJE</button>
<button class="big alt" type="button" data-go="settings">POSTAVKE</button>
</div>
</section>

<section id="levels" class="view">
<h2 id="levelsTitle">NIVOI</h2>
<div class="levels">
<button class="level" type="button" data-level="1">NIVO 1 — SLIKE</button>
<button class="level" type="button" data-level="2">NIVO 2 — SLIKE + BROJEVI</button>
<button class="level" type="button" data-level="3">NIVO 3 — BROJEVNA PRAVA</button>
<button class="level" type="button" data-level="4">NIVO 4 — ODABERI ODGOVOR</button>
<button class="level" type="button" data-level="5">NIVO 5 — SAMOSTALNI UNOS</button>
</div>
</section>

<section id="task" class="view">
<div id="progress" class="progress"></div>
<h2 id="taskTitle">ZADATAK</h2>
<div id="visual"></div>
<div id="problem" class="problem">3 + 2 = ?</div>
<div id="choiceArea" class="answers">
<button id="ans0" class="answer" type="button">4</button>
<button id="ans1" class="answer" type="button">5</button>
<button id="ans2" class="answer" type="button">6</button>
</div>
<div id="inputArea" style="display:none">
<input id="answerInput" class="inputAnswer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="?">
<div class="keypad">
<button class="key" type="button" data-key="1">1</button><button class="key" type="button" data-key="2">2</button><button class="key" type="button" data-key="3">3</button>
<button class="key" type="button" data-key="4">4</button><button class="key" type="button" data-key="5">5</button><button class="key" type="button" data-key="6">6</button>
<button class="key" type="button" data-key="7">7</button><button class="key" type="button" data-key="8">8</button><button class="key" type="button" data-key="9">9</button>
<button class="key" type="button" data-key="0">0</button><button id="clearKey" class="key" type="button">⌫</button><button id="checkInput" class="key" type="button">✓</button>
</div>
</div>
<div id="feedback"></div>
<div class="actions"><button id="helpBtn" class="action secondary" type="button">POMOĆ</button><button id="nextBtn" class="action" type="button" style="display:none">SLJEDEĆI ZADATAK</button></div>
</section>

<section id="practice" class="view"><h2>VJEŽBAMO</h2><div class="options">
<button class="option" type="button" data-practice="add">SABIRANJE</button><button class="option" type="button" data-practice="sub">ODUZIMANJE</button><button class="option" type="button" data-practice="both">OBOJE</button>
</div><h2>DUŽINA SERIJE</h2><div class="options"><button class="option" type="button" data-count="5">5</button><button class="option" type="button" data-count="10">10</button><button class="option" type="button" data-count="20">20</button></div></section>

<section id="quiz" class="view"><h2>BRZI KVIZ — 10 ZADATAKA</h2><div class="options">
<button class="option" type="button" data-quiz="add">SABIRANJE</button><button class="option" type="button" data-quiz="sub">ODUZIMANJE</button><button class="option" type="button" data-quiz="both">OBOJE</button>
</div></section>

<section id="competitionSetup" class="view"><h2>TAKMIČENJE</h2><div class="panel">
<div class="row"><label>Učenik 1</label><input class="name playerName" value="Učenik 1"></div>
<div class="row"><label>Učenik 2</label><input class="name playerName" value="Učenik 2"></div>
<div class="row"><label>Učenik 3</label><input class="name playerName" placeholder="Opcionalno"></div>
<div class="row"><label>Učenik 4</label><input class="name playerName" placeholder="Opcionalno"></div>
<div class="row"><label>Učenik 5</label><input class="name playerName" placeholder="Opcionalno"></div>
</div><div class="options"><button class="option compOp" type="button" data-op="add">SABIRANJE</button><button class="option compOp" type="button" data-op="sub">ODUZIMANJE</button><button class="option compOp" type="button" data-op="both">OBOJE</button></div>
<div class="actions"><button id="startComp" class="action" type="button">POČNI TAKMIČENJE</button></div></section>

<section id="settings" class="view"><h2>POSTAVKE</h2><div class="panel">
<h3>NAJVEĆI BROJ</h3><div class="options"><button class="option setMax" type="button" data-max="5">DO 5</button><button class="option setMax" type="button" data-max="10">DO 10</button><button class="option setMax" type="button" data-max="20">DO 20</button></div>
<h3>ZVUK</h3><div class="options"><button class="option setSound" type="button" data-sound="1">UKLJUČEN</button><button class="option setSound" type="button" data-sound="0">ISKLJUČEN</button></div>
</div></section>

<section id="result" class="view"><h2>REZULTAT</h2><div id="resultBox" class="panel" style="font-size:30px;font-weight:900"></div><div class="actions"><button class="action" type="button" data-go="home">GLAVNI MENI</button></div></section>
</div>

<script>
(function(){
"use strict";
var views=document.querySelectorAll(".view"), history=[], currentView="home";
var settings={max:20,sound:true}, mode="learn",op="add",level=1,current=null,series=null,practiceOp="both",practiceCount=5,competition=null;
try{var z=JSON.parse(localStorage.getItem("m20")||"{}");if(z.max)settings.max=z.max;if(typeof z.sound==="boolean")settings.sound=z.sound;}catch(e){}
function save(){try{localStorage.setItem("m20",JSON.stringify(settings));}catch(e){}}
function show(id,push){for(var i=0;i<views.length;i++)views[i].className="view";document.getElementById(id).className="view active";if(push!==false&&currentView!==id)history.push(currentView);currentView=id;document.getElementById("nav").style.display=id==="home"?"none":"flex";}
function home(){history=[];show("home",false)}
function back(){if(history.length)show(history.pop(),false);else home()}
document.getElementById("homeBtn").onclick=home;document.getElementById("backBtn").onclick=back;
var gos=document.querySelectorAll("[data-go]");for(var i=0;i<gos.length;i++)gos[i].onclick=function(){var x=this.getAttribute("data-go");if(x==="learnAdd"){op="add";document.getElementById("levelsTitle").innerHTML="UČIMO SABIRANJE";show("levels");}else if(x==="learnSub"){op="sub";document.getElementById("levelsTitle").innerHTML="UČIMO ODUZIMANJE";show("levels");}else show(x);};
function rnd(n){return Math.floor(Math.random()*n)}
function gen(which,max){var a,b;if(which==="both")which=Math.random()<.5?"add":"sub";if(which==="add"){a=rnd(max+1);b=rnd(max-a+1);return{a:a,b:b,op:"add",ans:a+b}}a=rnd(max+1);b=rnd(a+1);return{a:a,b:b,op:"sub",ans:a-b}}
function sym(x){return x==="add"?"+":"−"}
function vals(ans,max){var a=[ans],v;while(a.length<3){v=ans+(rnd(7)-3);if(v>=0&&v<=max&&a.indexOf(v)<0)a.push(v)}for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function sound(ok){if(!settings.sound)return;try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;var c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?650:220;g.gain.value=.04;o.start();setTimeout(function(){o.stop();c.close()},100)}catch(e){}}
function stars(n,cross){var s="";for(var i=0;i<n;i++)s+=(cross&&i>=n-cross?"❌":"⭐");return s}
function newTask(){
 current=gen(op,settings.max);document.getElementById("taskTitle").innerHTML=mode==="competition"?"TAKMIČENJE":mode==="quiz"?"BRZI KVIZ":mode==="practice"?"VJEŽBAMO":"NIVO "+level;
 document.getElementById("problem").innerHTML=current.a+" "+sym(current.op)+" "+current.b+" = ?";
 document.getElementById("visual").innerHTML=(level<=2||mode!=="learn")?(current.op==="add"?stars(current.a,0)+" &nbsp;+&nbsp; "+stars(current.b,0):stars(current.a,current.b)):"";
 document.getElementById("feedback").innerHTML="";document.getElementById("nextBtn").style.display="none";
 var input=mode==="learn"&&level===5;document.getElementById("choiceArea").style.display=input?"none":"grid";document.getElementById("inputArea").style.display=input?"block":"none";document.getElementById("answerInput").value="";
 if(!input){var a=vals(current.ans,settings.max);for(var i=0;i<3;i++){var b=document.getElementById("ans"+i);b.innerHTML=a[i];b.className="answer";b.disabled=false}}
 updateProgress();show("task");
}
function updateProgress(){var p="";if(series)p="ZADATAK "+(series.i+1)+" / "+series.total+" &nbsp; • &nbsp; TAČNO: "+series.correct;if(mode==="competition"&&competition)p=competition.players[competition.turn].name+" &nbsp; • &nbsp; "+competition.players[competition.turn].score+" BODOVA";document.getElementById("progress").innerHTML=p}
function check(v,b){var ok=Number(v)===current.ans;sound(ok);var f=document.getElementById("feedback");if(ok){f.innerHTML="BRAVO! TAČNO.";f.style.color="#16853b";if(b)b.className="answer correct";finishAnswer(true)}else{f.innerHTML="POKUŠAJ PONOVO.";f.style.color="#c62828";if(b){b.className="answer wrong";setTimeout(function(){b.className="answer"},500)}if(mode==="practice"||mode==="quiz"||mode==="competition")finishAnswer(false)}}
for(i=0;i<3;i++)document.getElementById("ans"+i).onclick=function(){check(this.innerHTML,this)};
function finishAnswer(ok){if(mode==="learn"){if(ok)document.getElementById("nextBtn").style.display="inline-block";return}
 if(mode==="competition"){var pl=competition.players[competition.turn];if(ok)pl.score++;pl.done++;setTimeout(nextCompetition,600);return}
 if(series){if(ok)series.correct++;else series.wrong++;series.i++;if(series.i>=series.total)setTimeout(showResult,500);else setTimeout(newTask,500)}
}
document.getElementById("nextBtn").onclick=newTask;
document.getElementById("checkInput").onclick=function(){check(document.getElementById("answerInput").value,null)};
var keys=document.querySelectorAll("[data-key]");for(i=0;i<keys.length;i++)keys[i].onclick=function(){var x=document.getElementById("answerInput");if(x.value.length<2)x.value+=this.getAttribute("data-key")};
document.getElementById("clearKey").onclick=function(){document.getElementById("answerInput").value=""};
document.getElementById("helpBtn").onclick=function(){document.getElementById("visual").innerHTML=current.op==="add"?stars(current.a,0)+" &nbsp;+&nbsp; "+stars(current.b,0):stars(current.a,current.b)};
var ls=document.querySelectorAll("[data-level]");for(i=0;i<ls.length;i++)ls[i].onclick=function(){level=Number(this.getAttribute("data-level"));mode="learn";series=null;newTask()};
var po=document.querySelectorAll("[data-practice]");for(i=0;i<po.length;i++)po[i].onclick=function(){practiceOp=this.getAttribute("data-practice");var all=document.querySelectorAll("[data-practice]");for(var j=0;j<all.length;j++)all[j].style.borderColor="#bdd2f3";this.style.borderColor="#2764d8"};
var pc=document.querySelectorAll("[data-count]");for(i=0;i<pc.length;i++)pc[i].onclick=function(){practiceCount=Number(this.getAttribute("data-count"));mode="practice";op=practiceOp;series={i:0,total:practiceCount,correct:0,wrong:0};newTask()};
var qs=document.querySelectorAll("[data-quiz]");for(i=0;i<qs.length;i++)qs[i].onclick=function(){mode="quiz";op=this.getAttribute("data-quiz");series={i:0,total:10,correct:0,wrong:0};newTask()};
function showResult(){var pct=Math.round(series.correct/series.total*100),msg=mode==="quiz"?(pct>=90?"ODLIČNO!":pct>=70?"BRAVO!":"VJEŽBAJMO JOŠ!"):"USPJEŠNOST: "+pct+"%";document.getElementById("resultBox").innerHTML="TAČNO: "+series.correct+" / "+series.total+"<br>"+msg;series=null;show("result")}
var sm=document.querySelectorAll(".setMax");for(i=0;i<sm.length;i++)sm[i].onclick=function(){settings.max=Number(this.getAttribute("data-max"));save();alert("Postavljeno: do "+settings.max)};
var ss=document.querySelectorAll(".setSound");for(i=0;i<ss.length;i++)ss[i].onclick=function(){settings.sound=this.getAttribute("data-sound")==="1";save();alert(settings.sound?"Zvuk uključen":"Zvuk isključen")};
var cop="both";var co=document.querySelectorAll(".compOp");for(i=0;i<co.length;i++)co[i].onclick=function(){cop=this.getAttribute("data-op");for(var j=0;j<co.length;j++)co[j].style.borderColor="#bdd2f3";this.style.borderColor="#2764d8"};
document.getElementById("startComp").onclick=function(){var ins=document.querySelectorAll(".playerName"),players=[];for(var j=0;j<ins.length;j++){var n=ins[j].value.replace(/^\s+|\s+$/g,"");if(n)players.push({name:n,score:0,done:0})}if(players.length<2){alert("Unesi najmanje 2 učenika.");return}competition={players:players,turn:0,total:5};mode="competition";op=cop;series=null;newTask()};
function nextCompetition(){var c=competition;c.turn=(c.turn+1)%c.players.length;var done=true;for(var j=0;j<c.players.length;j++)if(c.players[j].done<c.total)done=false;if(done){var a=c.players.slice().sort(function(x,y){return y.score-x.score}),txt="";for(j=0;j<a.length;j++)txt+=(j+1)+". "+a[j].name+" — "+a[j].score+"<br>";document.getElementById("resultBox").innerHTML=txt+"<br><b>BRAVO!</b>";show("result");return}while(c.players[c.turn].done>=c.total)c.turn=(c.turn+1)%c.players.length;newTask()}
document.getElementById("nav").style.display="none";
window.onerror=function(msg){document.getElementById("feedback").innerHTML="Greška: "+msg;return false};
})();
</script>
<script>
if("serviceWorker" in navigator && location.protocol==="https:"){window.addEventListener("load",function(){navigator.serviceWorker.register("./service-worker.js").catch(function(){})})}
</script>
</body></html>
