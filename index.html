<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sabiranje i oduzimanje do 20</title>
<meta name="theme-color" content="#f4f8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Matematika do 20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#17324d;--blue:#2764d8;--blue2:#e8f0ff;--green:#168a52;--red:#c63f3f;--yellow:#ffd75e;--shadow:0 10px 28px #17324d18}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;border:0}
#app{min-height:100vh;padding:20px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.brand{font-weight:900;font-size:clamp(24px,3vw,44px);letter-spacing:.4px}.tag{font-size:18px;opacity:.6;font-weight:700}
.nav{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 14px}.nav button,.smallbtn{min-height:64px;padding:12px 22px;border-radius:18px;background:#fff;color:var(--ink);font-weight:900;font-size:22px;box-shadow:var(--shadow)}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;width:min(1500px,100%);margin:auto}
h1,h2,h3,p{margin:0;text-align:center}h1{font-size:clamp(34px,5vw,70px)}h2{font-size:clamp(30px,4vw,56px)}h3{font-size:clamp(24px,3vw,38px)}
.menu{width:min(1200px,100%);display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:22px}
.bigbtn{min-height:100px;padding:18px 26px;border-radius:24px;background:var(--blue);color:#fff;font-size:clamp(25px,2.5vw,38px);font-weight:900;box-shadow:var(--shadow);transition:transform .08s,filter .08s}
.bigbtn:active,.answer:active,.key:active{transform:scale(.97);filter:brightness(.96)}.bigbtn.alt{background:#fff;color:var(--blue);border:4px solid var(--blue)}
.panel{width:min(1200px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:var(--shadow)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:100%}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;width:100%}
.choice{min-height:86px;border-radius:20px;background:var(--blue2);color:var(--ink);font-size:clamp(22px,2.4vw,34px);font-weight:900;padding:14px}.choice.selected{background:var(--blue);color:#fff;outline:5px solid #aac6ff}
.problem{font-size:clamp(58px,9vw,120px);font-weight:900;line-height:1;text-align:center}.subproblem{font-size:clamp(32px,5vw,62px);font-weight:900}
.answers{display:grid;grid-template-columns:repeat(3,minmax(150px,260px));gap:24px;justify-content:center;width:100%}
.answer{min-height:110px;border-radius:24px;background:#fff;color:var(--ink);font-size:clamp(40px,5vw,66px);font-weight:900;box-shadow:var(--shadow);border:4px solid #d9e5f6}.answer.correct{background:#d9f6e7;border-color:var(--green);color:var(--green)}.answer.wrong{background:#ffe1e1;border-color:var(--red);color:var(--red)}
.feedback{min-height:56px;font-size:clamp(27px,3vw,42px);font-weight:900}.good{color:var(--green)}.bad{color:var(--red)}
.objects{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;min-height:100px}.group{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:500px}.obj{font-size:clamp(38px,4vw,58px);line-height:1}.obj.removed{opacity:.28;text-decoration:line-through;text-decoration-thickness:5px;text-decoration-color:var(--red)}
.mathsign{font-size:60px;font-weight:900}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;width:min(1300px,100%)}.levelbtn{min-height:120px;border-radius:22px;background:#fff;box-shadow:var(--shadow);padding:14px;font-size:23px;font-weight:900;color:var(--ink)}.levelbtn b{display:block;color:var(--blue);font-size:32px;margin-bottom:7px}
.actions{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;width:100%}.actions button{min-height:76px;padding:12px 24px;border-radius:20px;background:var(--blue);color:#fff;font-size:25px;font-weight:900}.actions .secondary{background:#fff;color:var(--blue);border:3px solid var(--blue)}
.progresswrap{width:min(900px,100%)}.progressline{display:flex;justify-content:space-between;font-size:24px;font-weight:900;margin-bottom:8px}.progress{height:22px;background:#dfe8f4;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:var(--blue);transition:width .25s}
.numberline{width:min(1300px,96vw);overflow-x:auto;padding:30px 10px 15px}.nl{display:grid;grid-template-columns:repeat(21,58px);min-width:1218px;position:relative;padding-top:60px}.tick{text-align:center;font-size:23px;font-weight:800;border-top:5px solid var(--ink);padding-top:9px;position:relative}.tick:before{content:"";position:absolute;top:-11px;left:50%;height:18px;border-left:4px solid var(--ink)}.tick.start,.tick.end{color:var(--blue);font-size:30px}.tick.end{color:var(--green)}
.jumps{position:absolute;left:0;top:0;width:100%;height:55px;pointer-events:none}.jump{position:absolute;height:42px;border:4px solid var(--blue);border-bottom:0;border-radius:50% 50% 0 0;opacity:0;animation:appear .45s forwards}.jump.back{border-top-color:#9a4fd0;border-left-color:#9a4fd0;border-right-color:#9a4fd0}@keyframes appear{to{opacity:1}}
.keypad{display:grid;grid-template-columns:repeat(3,120px);gap:14px;justify-content:center}.key{height:82px;border-radius:18px;background:#fff;box-shadow:var(--shadow);font-size:38px;font-weight:900}.entry{min-width:180px;min-height:90px;border:5px solid #bfd0e6;border-radius:20px;background:#fff;font-size:60px;font-weight:900;text-align:center;padding:8px}
.scoretable{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.scorechip{background:#fff;border:4px solid transparent;border-radius:18px;padding:12px 20px;font-size:23px;font-weight:900;box-shadow:var(--shadow)}.scorechip.active{border-color:var(--blue);background:var(--blue2)}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center;margin:15px 0}.formrow label{font-size:25px;font-weight:900}.nameinput{width:100%;min-height:72px;border:4px solid #bfd0e6;border-radius:18px;padding:10px 16px;font-size:30px;font-weight:800}
.resultbox{font-size:clamp(28px,3.5vw,48px);line-height:1.6;font-weight:800;text-align:center}.winner{font-size:clamp(45px,7vw,90px);font-weight:1000;color:var(--green)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-30px;font-style:normal;font-size:28px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
.note{font-size:22px;text-align:center;opacity:.78}.helpbox{background:#fff8d7;border:4px solid #ffd75e;border-radius:22px;padding:18px;font-size:25px;font-weight:800;text-align:center;width:min(900px,100%)}
@media(max-width:900px){#app{padding:12px}.menu,.grid2,.grid3{grid-template-columns:1fr}.levels{grid-template-columns:1fr 1fr}.answers{grid-template-columns:repeat(3,1fr);gap:10px}.answer{min-width:0}.formrow{grid-template-columns:1fr}.brand{font-size:24px}.tag{font-size:14px}}
@media(max-width:600px){.levels{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.keypad{grid-template-columns:repeat(3,90px)}}

 .menu{grid-template-columns:1fr;gap:12px}

button{display:block}

.screen,.menu,.panel,.answers,.actions,.levels{min-width:0}

 body{position:relative;width:100%;overflow-x:hidden}
 #app{width:100%;min-height:-webkit-fill-available}

<body>
<div id="app">
<header><div class="brand">SABIRANJE I ODUZIMANJE DO 20</div><div class="tag">dbahrudin</div></header>
<div id="nav" class="nav"></div><main id="screen" class="screen"></main>
</div>
<script>

(function(){
"use strict";
var screen=document.getElementById("screen"),nav=document.getElementById("nav");
var DEFAULT={operation:"both",max:20,sound:true,pictures:true,numberline:true,animations:true,autoNext:false,autoDelay:2,lastLevel:1};
var settings={}; var k;
for(k in DEFAULT) settings[k]=DEFAULT[k];
try{var saved=JSON.parse(localStorage.getItem("math20settings")||"{}");for(k in saved)settings[k]=saved[k];}catch(e){}
var state={page:"home",learnOp:"add",level:1,current:null,answered:false,used:{},series:null,competition:null};
var icons=["🍎","⚽","⭐","●","🌼","✏️","🟦","🐞"];

function save(){try{localStorage.setItem("math20settings",JSON.stringify(settings));}catch(e){}}
function makeBtn(txt,fn,cls){var b=document.createElement("button");b.className=cls||"bigbtn";b.appendChild(document.createTextNode(txt));b.onclick=fn;return b;}
function clearScreen(){while(screen.firstChild)screen.removeChild(screen.firstChild);}
function setNav(back,home){while(nav.firstChild)nav.removeChild(nav.firstChild);if(back)nav.appendChild(makeBtn("← NAZAD",goBack,"smallbtn"));if(home)nav.appendChild(makeBtn("⌂ POČETNA",showHome,"smallbtn"));}
function heading(t){var h=document.createElement("h2");h.appendChild(document.createTextNode(t));screen.appendChild(h);}
function goBack(){if(state.page==="learnTask")showLearnLevels(state.learnOp);else if(state.page==="series")showPractice();else if(state.page==="competition")showCompetitionSetup();else showHome();}
function rand(n){return Math.floor(Math.random()*n);}
function opSym(op){return op==="add"?"+":"−";}
function taskKey(t){return String(t.a)+t.op+String(t.b);}
function genTask(op,max,used){
 max=max||settings.max; var tries=0,t,actual,a,b;
 do{
  actual=op==="both"?(Math.random()<0.5?"add":"sub"):op;
  if(actual==="add"){a=rand(max+1);b=rand(max-a+1);t={a:a,b:b,op:"add",ans:a+b};}
  else{a=rand(max+1);b=rand(a+1);t={a:a,b:b,op:"sub",ans:a-b};}
  tries++;
 }while(used&&used[taskKey(t)]&&tries<100);
 if(used)used[taskKey(t)]=true; return t;
}
function shuffle(a){var i,j,x;for(i=a.length-1;i>0;i--){j=rand(i+1);x=a[i];a[i]=a[j];a[j]=x;}return a;}
function choices(ans,max){max=typeof max==="number"?max:settings.max;var a=[ans],d=[-2,-1,1,2,3,-3],i,v;shuffle(d);for(i=0;i<d.length&&a.length<3;i++){v=ans+d[i];if(v>=0&&v<=max&&a.indexOf(v)<0)a.push(v);}while(a.length<3){v=rand(max+1);if(a.indexOf(v)<0)a.push(v);}return shuffle(a);}
function audio(ok){if(!settings.sound)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var c=new AC(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:230;g.gain.value=.05;o.start(0);setTimeout(function(){try{o.stop(0);c.close();}catch(e){}},140);}catch(e){}}

function showHome(){
 state.page="home";state.series=null;clearScreen();setNav(false,false);
 var h=document.createElement("h1");h.appendChild(document.createTextNode("UČIMO I VJEŽBAMO"));screen.appendChild(h);
 var m=document.createElement("div");m.className="menu";
 var items=[
 ["UČIMO SABIRANJE",function(){showLearnLevels("add");}],
 ["UČIMO ODUZIMANJE",function(){showLearnLevels("sub");}],
 ["VJEŽBAMO",showPractice],["BRZI KVIZ",showQuizSetup],["TAKMIČENJE",showCompetitionSetup],["POSTAVKE",showSettings]
 ];
 for(var i=0;i<items.length;i++)m.appendChild(makeBtn(items[i][0],items[i][1],items[i][0]==="POSTAVKE"?"bigbtn alt":"bigbtn"));
 screen.appendChild(m);
}
function showLearnLevels(op){
 state.page="learnLevels";state.learnOp=op;clearScreen();setNav(true,true);heading(op==="add"?"UČIMO SABIRANJE":"UČIMO ODUZIMANJE");
 var names=op==="add"?["SABIRANJE SLIKA","SLIKA + BROJEVI","BROJEVNA PRAVA","SABIRANJE BROJEVA","SAMOSTALNI UNOS"]:["ODUZIMANJE UZ SLIKE","SLIKA + BROJEVI","BROJEVNA PRAVA","ODUZIMANJE BROJEVA","SAMOSTALNI UNOS"];
 var l=document.createElement("div");l.className="levels";
 for(var i=0;i<5;i++)(function(n){var b=makeBtn("NIVO "+n+" — "+names[n-1],function(){startLearn(n);},"levelbtn");l.appendChild(b);})(i+1);
 screen.appendChild(l);
}
function startLearn(level){state.page="learnTask";state.level=level;settings.lastLevel=level;save();state.used={};newLearnTask();}
function newLearnTask(){state.current=genTask(state.learnOp,settings.max,state.used);state.answered=false;renderLearn();}
function objectGroup(n,icon,removeFrom){var g=document.createElement("div");g.className="group";for(var i=0;i<n;i++){var x=document.createElement("span");x.className="obj"+(i>=removeFrom?" removed":"");x.appendChild(document.createTextNode(icon));g.appendChild(x);}return g;}
function renderObjects(t,withNumbers){
 if(!settings.pictures)return;
 var w=document.createElement("div");w.className="objects";var icon=icons[rand(icons.length)];
 if(t.op==="add"){w.appendChild(objectGroup(t.a,icon,999));var sg=document.createElement("b");sg.className="mathsign";sg.appendChild(document.createTextNode("+"));w.appendChild(sg);w.appendChild(objectGroup(t.b,icon,999));}
 else w.appendChild(objectGroup(t.a,icon,t.a-t.b));
 screen.appendChild(w);
 if(withNumbers){var p=document.createElement("div");p.className="subproblem";p.appendChild(document.createTextNode(t.a+" "+opSym(t.op)+" "+t.b+" = ?"));screen.appendChild(p);}
}
function problem(t){var p=document.createElement("div");p.className="problem";p.appendChild(document.createTextNode(t.a+" "+opSym(t.op)+" "+t.b+" = ?"));screen.appendChild(p);}
function renderLearn(){
 clearScreen();setNav(true,true);var t=state.current;heading((state.learnOp==="add"?"SABIRANJE":"ODUZIMANJE")+" — NIVO "+state.level);
 if(state.level===1||state.level===2)renderObjects(t,true);
 if((state.level===1||state.level===2)&&!settings.pictures)problem(t);
 if(state.level===3){problem(t);if(settings.numberline)renderNumberLine(t,false);}
 if(state.level===4)problem(t);
 if(state.level===5){renderInputTask(t);return;}
 renderAnswers(t,newLearnTask,false);
 var ac=document.createElement("div");ac.className="actions";ac.appendChild(makeBtn("POMOĆ",function(){showHelp(t);},"secondary"));
 if(state.level===3&&settings.numberline)ac.appendChild(makeBtn("POKAŽI KORAKE",function(){renderNumberLine(t,true,true);},"secondary"));screen.appendChild(ac);
}
function renderAnswers(t,next,advanceWrong){
 var a=document.createElement("div");a.className="answers",vals=choices(t.ans,settings.max);
 for(var i=0;i<vals.length;i++)(function(v){var b=makeBtn(String(v),function(){checkChoice(b,v,t,next,advanceWrong);},"answer");a.appendChild(b);})(vals[i]);
 screen.appendChild(a);var f=document.createElement("div");f.className="feedback";f.id="feedback";screen.appendChild(f);
}
function checkChoice(b,v,t,next,advanceWrong){
 if(state.answered)return;var ok=v===t.ans,f=document.getElementById("feedback");audio(ok);
 if(ok){b.className+=" correct";f.innerHTML="BRAVO! TAČNO.";f.className="feedback good";state.answered=true;if(state.series)recordSeries(true);if(state.competition&&state.page==="competition"){recordCompetition(true);return;}nextButton(next);}
 else{b.className+=" wrong";f.innerHTML="POKUŠAJ PONOVO.";f.className="feedback bad";setTimeout(function(){b.className=b.className.replace(" wrong","");},500);if(state.series&&advanceWrong){state.answered=true;recordSeries(false);nextButton(next);}if(state.competition&&state.page==="competition"){state.answered=true;recordCompetition(false);}}
}
