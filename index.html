<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2764d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Matematika 20">
<link rel="manifest" href="./manifest.webmanifest?v=offline2">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Sabiranje i oduzimanje do 20</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f8ff;color:#17324b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
button,input{font:inherit}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;max-width:900px;margin:auto}.title{font-weight:950;font-size:clamp(18px,5vw,30px)}.author{font-weight:800;font-size:13px}
#nav{display:none;gap:8px;max-width:900px;margin:10px auto}.nav{min-height:48px;border:0;border-radius:14px;padding:8px 14px;background:#dce9ff;color:#17324b;font-weight:900}
.page{display:none;max-width:900px;margin:12px auto;text-align:center}.page.on{display:block}h1{font-size:clamp(30px,9vw,54px);margin:14px 0}h2{font-size:clamp(25px,7vw,40px);margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.big,.select,.action{border:0;border-radius:19px;font-weight:950;touch-action:manipulation}.big{min-height:90px;padding:14px;background:#2764d8;color:#fff;font-size:clamp(19px,5vw,27px);box-shadow:0 5px 0 #174aa8}.purple{background:#7653c7;box-shadow:0 5px 0 #50349a}.select{min-height:75px;padding:10px;background:#fff;color:#17324b;border:3px solid #b9cff0;font-size:19px}.select.chosen{border-color:#2764d8;background:#eaf2ff}
.problem{font-size:clamp(50px,16vw,92px);font-weight:950;margin:18px 0}.visual{font-size:clamp(27px,8vw,45px);min-height:58px;overflow-wrap:anywhere}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:min(650px,100%);margin:18px auto}.answer{display:block;width:100%;min-height:86px;border:4px solid #8bb5ed;border-radius:18px;background:#fff;color:#17324b;font-size:clamp(36px,11vw,60px);font-weight:950}.answer.good{background:#d8f7df;border-color:#249b43}.answer.bad{background:#ffe1e1;border-color:#d32f2f}
.feedback{min-height:44px;font-size:clamp(22px,6vw,32px);font-weight:950;margin:8px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.action{min-height:56px;padding:9px 17px;background:#2764d8;color:white;font-size:18px}.secondary{background:#e0eafa;color:#17324b}
.answerInput{display:block;width:min(260px,80%);min-height:78px;margin:12px auto;border:4px solid #2764d8;border-radius:18px;padding:8px;text-align:center;background:#fff;color:#111;font-size:46px;font-weight:950;-webkit-user-select:text;user-select:text}.keypad{display:grid;grid-template-columns:repeat(3,88px);gap:8px;justify-content:center;margin:10px}.key{height:60px;border:3px solid #b9cff0;border-radius:14px;background:#fff;color:#17324b;font-size:28px;font-weight:900}
.panel{background:#fff;border:3px solid #d5e2f4;border-radius:20px;padding:16px;margin:12px auto;width:min(720px,100%)}.row{display:grid;grid-template-columns:1fr 2fr;gap:9px;align-items:center;margin:10px 0;text-align:left}.name{display:block;width:100%;min-height:58px;border:3px solid #8fb1e1;border-radius:14px;padding:8px 11px;background:#fff;color:#111;font-size:20px;-webkit-user-select:text;user-select:text}.progress{font-size:18px;font-weight:900;min-height:28px}.scoreboard{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.chip{padding:8px 11px;border-radius:12px;background:#e3edf9;font-weight:900}.chip.active{background:#ffd866}.result{font-size:27px;line-height:1.5;font-weight:900}
@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}.big{min-height:74px}.answers{gap:7px}.answer{min-height:74px}.row{grid-template-columns:1fr}.keypad{grid-template-columns:repeat(3,minmax(70px,88px))}}

.numberlineWrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:34px 8px 18px;margin:6px auto 12px}
.numberline{position:relative;display:flex;align-items:flex-start;justify-content:space-between;min-width:560px;width:100%;height:105px;padding:0 18px}
.numberline:before{content:"";position:absolute;left:18px;right:18px;top:30px;height:5px;background:#17324b;border-radius:4px}
.tick{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-width:22px;font-size:15px;font-weight:900}
.tick:before{content:"";width:5px;height:24px;background:#17324b;margin:20px 0 5px;border-radius:3px}
.tick.start:before{background:#2764d8;height:31px;margin-top:13px}
.tick.finish:before{background:#16853b;height:31px;margin-top:13px}
.jumpRow{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;min-height:42px;margin-top:-8px}
.jump{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:38px;padding:0 8px;border-radius:20px;background:#e7f0ff;color:#174a9b;font-size:18px;font-weight:950}
.jump.minus{background:#ffe8e8;color:#b42323}
.lineHint{font-size:19px;font-weight:900;margin:2px 0 8px}
@media(max-width:650px){.numberline{min-width:520px}.numberlineWrap{padding-left:0;padding-right:0}}

</style>
</head>
<body>
<div class="top"><div class="title">SABIRANJE I ODUZIMANJE DO 20</div><div class="author">dbahrudin</div></div>
<div id="nav"><button id="back" class="nav" type="button">← NAZAD</button><button id="homeButton" class="nav" type="button">⌂ POČETNA</button></div>

<div id="home" class="page on"><h1>UČIMO I VJEŽBAMO</h1><div class="grid">
<button id="learnAdd" class="big" type="button">UČIMO SABIRANJE</button><button id="learnSub" class="big" type="button">UČIMO ODUZIMANJE</button>
<button id="practiceButton" class="big" type="button">VJEŽBAMO</button><button id="quizButton" class="big" type="button">BRZI KVIZ</button>
<button id="competitionButton" class="big" type="button">TAKMIČENJE</button><button id="settingsButton" class="big purple" type="button">POSTAVKE</button>
</div></div>

<div id="levels" class="page"><h2 id="levelHeading">NIVOI</h2><div class="grid">
<button class="select level" data-level="1" type="button">NIVO 1<br>SLIKE</button><button class="select level" data-level="2" type="button">NIVO 2<br>SLIKE + BROJEVI</button>
<button class="select level" data-level="3" type="button">NIVO 3<br>BROJEVNA PRAVA</button><button class="select level" data-level="4" type="button">NIVO 4<br>ODABERI ODGOVOR</button>
<button class="select level" data-level="5" type="button">NIVO 5<br>SAMOSTALNI UNOS</button>
</div></div>

<div id="task" class="page"><div id="scoreboard" class="scoreboard"></div><div id="progress" class="progress"></div><h2 id="taskHeading">ZADATAK</h2><div id="visual" class="visual"></div><div id="problem" class="problem">3 + 2 = ?</div>
<div id="answers" class="answers"><button id="a0" class="answer" type="button">4</button><button id="a1" class="answer" type="button">5</button><button id="a2" class="answer" type="button">6</button></div>
<div id="inputBlock" style="display:none"><input id="resultInput" class="answerInput" type="number" inputmode="numeric" placeholder="?"><div class="keypad">
<button class="key digit" data-digit="1" type="button">1</button><button class="key digit" data-digit="2" type="button">2</button><button class="key digit" data-digit="3" type="button">3</button>
<button class="key digit" data-digit="4" type="button">4</button><button class="key digit" data-digit="5" type="button">5</button><button class="key digit" data-digit="6" type="button">6</button>
<button class="key digit" data-digit="7" type="button">7</button><button class="key digit" data-digit="8" type="button">8</button><button class="key digit" data-digit="9" type="button">9</button>
<button class="key digit" data-digit="0" type="button">0</button><button id="erase" class="key" type="button">⌫</button><button id="checkInput" class="key" type="button">✓</button></div></div>
<div id="feedback" class="feedback"></div><div class="actions"><button id="help" class="action secondary" type="button">POMOĆ</button><button id="next" class="action" type="button" style="display:none">SLJEDEĆI ZADATAK</button></div></div>

<div id="practice" class="page"><h2>VJEŽBAMO</h2><h3>ODABERI OPERACIJU</h3><div class="grid3">
<button class="select practiceOp" data-op="add" type="button">SABIRANJE</button><button class="select practiceOp" data-op="sub" type="button">ODUZIMANJE</button><button class="select practiceOp chosen" data-op="both" type="button">OBOJE</button></div>
<h3>BROJ ZADATAKA</h3><div class="grid3"><button class="select practiceCount" data-count="5" type="button">5</button><button class="select practiceCount" data-count="10" type="button">10</button><button class="select practiceCount" data-count="20" type="button">20</button></div></div>

<div id="quiz" class="page"><h2>BRZI KVIZ — 10 ZADATAKA</h2><div class="grid3"><button class="select quizOp" data-op="add" type="button">SABIRANJE</button><button class="select quizOp" data-op="sub" type="button">ODUZIMANJE</button><button class="select quizOp" data-op="both" type="button">OBOJE</button></div></div>

<div id="competition" class="page"><h2>TAKMIČENJE</h2><div class="panel">
<div class="row"><b>Učenik 1</b><input id="p1" class="name" type="text" value="Učenik 1"></div><div class="row"><b>Učenik 2</b><input id="p2" class="name" type="text" value="Učenik 2"></div>
<div class="row"><b>Učenik 3</b><input id="p3" class="name" type="text" placeholder="Opcionalno"></div><div class="row"><b>Učenik 4</b><input id="p4" class="name" type="text" placeholder="Opcionalno"></div><div class="row"><b>Učenik 5</b><input id="p5" class="name" type="text" placeholder="Opcionalno"></div></div>
<h3>OPERACIJA</h3><div class="grid3"><button class="select compOp" data-op="add" type="button">SABIRANJE</button><button class="select compOp" data-op="sub" type="button">ODUZIMANJE</button><button class="select compOp chosen" data-op="both" type="button">OBOJE</button></div>
<div class="actions" style="margin-top:16px"><button id="startCompetition" class="action" type="button">POČNI TAKMIČENJE</button></div></div>

<div id="settings" class="page"><h2>POSTAVKE</h2><div class="panel"><h3>NAJVEĆI BROJ</h3><div class="grid3"><button class="select maxBtn" data-max="5" type="button">DO 5</button><button class="select maxBtn" data-max="10" type="button">DO 10</button><button class="select maxBtn" data-max="20" type="button">DO 20</button></div><h3>ZVUK</h3><div class="grid"><button id="soundOn" class="select" type="button">UKLJUČEN</button><button id="soundOff" class="select" type="button">ISKLJUČEN</button></div></div></div>

<div id="result" class="page"><h2>REZULTAT</h2><div id="resultText" class="panel result"></div><div class="actions"><button id="resultHome" class="action" type="button">GLAVNI MENI</button></div></div>

<script>
(function(){
var pages=document.querySelectorAll(".page"),nav=document.getElementById("nav"),stack=[],page="home";
var max=20,soundEnabled=true,learnOp="add",level=1,mode="learn",current=null,series=null,practiceOp="both",competition=null,compOp="both";
try{var st=JSON.parse(localStorage.getItem("math20simple")||"{}");if(st.max)max=st.max;if(typeof st.sound==="boolean")soundEnabled=st.sound;}catch(e){}
function save(){try{localStorage.setItem("math20simple",JSON.stringify({max:max,sound:soundEnabled}))}catch(e){}}
function show(id,remember){for(var i=0;i<pages.length;i++)pages[i].className="page";document.getElementById(id).className="page on";if(remember!==false&&page!==id)stack.push(page);page=id;nav.style.display=id==="home"?"none":"flex"}
function goHome(){stack=[];show("home",false)}
function goBack(){if(stack.length)show(stack.pop(),false);else goHome()}
document.getElementById("homeButton").onclick=goHome;document.getElementById("back").onclick=goBack;document.getElementById("resultHome").onclick=goHome;
document.getElementById("learnAdd").onclick=function(){learnOp="add";document.getElementById("levelHeading").innerHTML="UČIMO SABIRANJE";show("levels")};
document.getElementById("learnSub").onclick=function(){learnOp="sub";document.getElementById("levelHeading").innerHTML="UČIMO ODUZIMANJE";show("levels")};
document.getElementById("practiceButton").onclick=function(){show("practice")};document.getElementById("quizButton").onclick=function(){show("quiz")};document.getElementById("competitionButton").onclick=function(){show("competition")};document.getElementById("settingsButton").onclick=function(){show("settings")};
function rnd(n){return Math.floor(Math.random()*n)}
function makeTask(which){var a,b;if(which==="both")which=Math.random()<.5?"add":"sub";if(which==="add"){a=rnd(max+1);b=rnd(max-a+1);return{a:a,b:b,op:"add",ans:a+b}}a=rnd(max+1);b=rnd(a+1);return{a:a,b:b,op:"sub",ans:a-b}}
function sign(o){return o==="add"?"+":"−"}
function options(ans){var x=[ans],v;while(x.length<3){v=ans+rnd(7)-3;if(v>=0&&v<=max&&x.indexOf(v)<0)x.push(v)}for(var i=x.length-1;i>0;i--){var j=rnd(i+1),t=x[i];x[i]=x[j];x[j]=t}return x}
function stars(n){var s="";for(var i=0;i<n;i++)s+="⭐";return s}
function crossed(a,b){var s="";for(var i=0;i<a;i++)s+=i>=a-b?"❌":"⭐";return s}
function beep(ok){if(!soundEnabled)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var c=new AC(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?650:220;g.gain.value=.04;o.start();setTimeout(function(){o.stop();c.close()},100)}catch(e){}}
function numberLineHTML(t){
 var out='<div class="lineHint">'+(t.op==="add"?'KRENI OD '+t.a+' I POMJERI SE '+t.b+' MJESTA UDESNO':'KRENI OD '+t.a+' I POMJERI SE '+t.b+' MJESTA ULIJEVO')+'</div>';
 out+='<div class="numberlineWrap"><div class="numberline">';
 for(var n=0;n<=max;n++){
  var cl="tick";
  if(n===t.a)cl+=" start";
  if(n===t.ans)cl+=" finish";
  out+='<span class="'+cl+'">'+n+'</span>';
 }
 out+='</div></div><div class="jumpRow">';
 for(var j=0;j<t.b;j++)out+='<span class="jump '+(t.op==="sub"?"minus":"")+'">'+(t.op==="add"?"+1 →":"← −1")+'</span>';
 out+='</div>';
 return out;
}
function draw(){
current=makeTask(mode==="learn"?learnOp:(mode==="competition"?compOp:series.op));document.getElementById("problem").innerHTML=current.a+" "+sign(current.op)+" "+current.b+" = ?";
var vis=document.getElementById("visual");if(mode==="learn"&&(level===1||level===2))vis.innerHTML=current.op==="add"?stars(current.a)+" &nbsp;+&nbsp; "+stars(current.b):crossed(current.a,current.b);else if(mode==="learn"&&level===3)vis.innerHTML=numberLineHTML(current);else vis.innerHTML="";
document.getElementById("feedback").innerHTML="";document.getElementById("next").style.display="none";document.getElementById("resultInput").value="";
var input=(mode==="learn"&&level===5);document.getElementById("answers").style.display=input?"none":"grid";document.getElementById("inputBlock").style.display=input?"block":"none";
var vals=options(current.ans);for(var i=0;i<3;i++){var b=document.getElementById("a"+i);b.innerHTML=vals[i];b.className="answer";b.disabled=false}
updateStatus();show("task")}
function updateStatus(){var p="",sb=document.getElementById("scoreboard");sb.innerHTML="";if(series)p="ZADATAK "+(series.index+1)+" / "+series.total+" • TAČNO: "+series.correct;if(mode==="competition"&&competition){var pl=competition.players[competition.turn];p="NA REDU JE: "+pl.name;for(var i=0;i<competition.players.length;i++){var d=document.createElement("span");d.className="chip"+(i===competition.turn?" active":"");d.innerHTML=competition.players[i].name+": "+competition.players[i].score;sb.appendChild(d)}}document.getElementById("progress").innerHTML=p}
function check(value,button){var ok=Number(value)===current.ans,f=document.getElementById("feedback");beep(ok);if(ok){f.innerHTML="BRAVO! TAČNO.";f.style.color="#16853b";if(button)button.className="answer good"}else{f.innerHTML="POKUŠAJ PONOVO.";f.style.color="#c62828";if(button){button.className="answer bad";setTimeout(function(){button.className="answer"},450)}}
if(mode==="learn"){if(ok)document.getElementById("next").style.display="inline-block";return}
if(mode==="competition"){var pl=competition.players[competition.turn];if(ok)pl.score++;pl.done++;setTimeout(nextCompetition,550);return}
if(series){if(ok)series.correct++;else series.wrong++;series.index++;if(series.index>=series.total)setTimeout(seriesResult,450);else setTimeout(draw,450)}}
document.getElementById("a0").onclick=function(){check(this.innerHTML,this)};document.getElementById("a1").onclick=function(){check(this.innerHTML,this)};document.getElementById("a2").onclick=function(){check(this.innerHTML,this)};
document.getElementById("next").onclick=draw;document.getElementById("checkInput").onclick=function(){check(document.getElementById("resultInput").value,null)};
var digits=document.querySelectorAll(".digit");for(var i=0;i<digits.length;i++)digits[i].onclick=function(){var x=document.getElementById("resultInput");if(x.value.length<2)x.value+=this.getAttribute("data-digit")};
document.getElementById("erase").onclick=function(){document.getElementById("resultInput").value=""};
document.getElementById("help").onclick=function(){document.getElementById("visual").innerHTML=current.op==="add"?stars(current.a)+" &nbsp;+&nbsp; "+stars(current.b):crossed(current.a,current.b)};
var levels=document.querySelectorAll(".level");for(i=0;i<levels.length;i++)levels[i].onclick=function(){level=Number(this.getAttribute("data-level"));mode="learn";series=null;draw()};
var pops=document.querySelectorAll(".practiceOp");for(i=0;i<pops.length;i++)pops[i].onclick=function(){practiceOp=this.getAttribute("data-op");for(var j=0;j<pops.length;j++)pops[j].className="select practiceOp";this.className="select practiceOp chosen"};
var counts=document.querySelectorAll(".practiceCount");for(i=0;i<counts.length;i++)counts[i].onclick=function(){mode="practice";series={op:practiceOp,total:Number(this.getAttribute("data-count")),index:0,correct:0,wrong:0};draw()};
var q=document.querySelectorAll(".quizOp");for(i=0;i<q.length;i++)q[i].onclick=function(){mode="quiz";series={op:this.getAttribute("data-op"),total:10,index:0,correct:0,wrong:0};draw()};
function seriesResult(){var pct=Math.round(series.correct/series.total*100),msg=mode==="quiz"?(pct>=90?"ODLIČNO!":pct>=70?"BRAVO!":"VJEŽBAJMO JOŠ!"):"USPJEŠNOST: "+pct+"%";document.getElementById("resultText").innerHTML="TAČNO: "+series.correct+" / "+series.total+"<br>NETAČNO: "+series.wrong+"<br>"+msg;series=null;show("result")}
var maxBtns=document.querySelectorAll(".maxBtn");for(i=0;i<maxBtns.length;i++)maxBtns[i].onclick=function(){max=Number(this.getAttribute("data-max"));save();for(var j=0;j<maxBtns.length;j++)maxBtns[j].className="select maxBtn";this.className="select maxBtn chosen"};
document.getElementById("soundOn").onclick=function(){soundEnabled=true;save();this.className="select chosen";document.getElementById("soundOff").className="select"};
document.getElementById("soundOff").onclick=function(){soundEnabled=false;save();this.className="select chosen";document.getElementById("soundOn").className="select"};
var cops=document.querySelectorAll(".compOp");for(i=0;i<cops.length;i++)cops[i].onclick=function(){compOp=this.getAttribute("data-op");for(var j=0;j<cops.length;j++)cops[j].className="select compOp";this.className="select compOp chosen"};
document.getElementById("startCompetition").onclick=function(){var players=[];for(var i=1;i<=5;i++){var n=document.getElementById("p"+i).value.replace(/^\s+|\s+$/g,"");if(n)players.push({name:n,score:0,done:0})}if(players.length<2){alert("Unesi najmanje dva učenika.");return}competition={players:players,turn:0,total:5};mode="competition";series=null;draw()};
function nextCompetition(){var c=competition,all=true;for(var i=0;i<c.players.length;i++)if(c.players[i].done<c.total)all=false;if(all){var a=c.players.slice().sort(function(x,y){return y.score-x.score}),txt="";for(i=0;i<a.length;i++)txt+=(i+1)+". "+a[i].name+" — "+a[i].score+" BODOVA<br>";document.getElementById("resultText").innerHTML=txt+"<br>BRAVO!";show("result");return}do{c.turn=(c.turn+1)%c.players.length}while(c.players[c.turn].done>=c.total);draw()}
nav.style.display="none";
})();
</script>

<script>
(function(){
 if(!("serviceWorker" in navigator)) return;
 if(location.protocol!=="https:" && location.hostname!=="localhost") return;
 window.addEventListener("load",function(){
   navigator.serviceWorker.register("./service-worker.js?v=offline2",{scope:"./"})
   .then(function(reg){ reg.update(); })
   .catch(function(err){
     var f=document.getElementById("feedback");
     if(f) f.textContent="Offline instalacija nije aktivirana: "+err.message;
   });
 });
})();
</script>
</body></html>
